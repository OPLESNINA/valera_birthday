<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С днём рождения!</title>
<link rel="preload" as="image" href="images/bg.png">

<link rel="preload" as="image" href="images/num_30.png">
<style>
  :root{ --stripe-blue:#a9d4f2; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#0d1220; overflow-x:hidden; width:100%;}
  body{
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }

  #canvas{
    width:100%;
    max-width:480px;
    margin:0 auto;
    position:relative;
    background:url('images/bg.png') top center / 100% auto repeat-y, var(--stripe-blue);
    overflow:hidden;
    min-height:5200px;
  }

  .item{ position:absolute; }
  .item img{ display:block; width:100%; }

  .fade-up{ opacity:0; transform:translateY(40px); transition:opacity .8s ease, transform .8s ease; }
  .fade-up.show{ opacity:1; transform:translateY(0); }
  .pop{ opacity:0; transform:translateY(30px) scale(.85); transition:opacity .7s cubic-bezier(.34,1.56,.64,1), transform .7s cubic-bezier(.34,1.56,.64,1); }
  .pop.show{ opacity:1; transform:translateY(0) scale(1); }

  /* эффект "выезжания вперёд" — цифра 30 и именинник */
  .zoom-forward{ opacity:0; transform:scale(.25); transition:opacity .9s cubic-bezier(.22,.9,.32,1.15), transform .9s cubic-bezier(.22,.9,.32,1.15); }
  .zoom-forward.show{ opacity:1; transform:scale(1); }

  /* дрожание — машинка и catdog */
  @keyframes wiggle{
    0%,100%{ transform:rotate(0deg); }
    20%{ transform:rotate(-4deg); }
    40%{ transform:rotate(3deg); }
    60%{ transform:rotate(-3deg); }
    80%{ transform:rotate(4deg); }
  }
  #mater img, #catdog img{
    animation:wiggle 1.6s ease-in-out infinite;
    transform-origin:50% 85%;
  }

  @media (prefers-reduced-motion: reduce){
    .fade-up,.pop,.zoom-forward{opacity:1 !important; transform:none !important; transition:none !important;}
    #mater img, #catdog img{ animation:none !important; }
  }

  /* film strip reveal — разматывается снизу вверх, из катушки */

  /* speech bubble */
  .bubble-text{
    position:absolute; top:8%; left:8%; right:8%; bottom:22%;
    font-size:13.5px; line-height:1.5; color:#1c3a52;
    display:flex; align-items:center; text-align:left;
  }
  .bubble-text[contenteditable="true"]{ outline:1px dashed #ff8a3d; background:rgba(255,255,255,.4); }

  /* play button */
  .play-btn{
    position:absolute; top:54.2%; left:42.4%; transform:translate(-50%,-50%);
    width:0; height:0; z-index:3;
    border-top:20px solid transparent; border-bottom:20px solid transparent;
    border-left:32px solid #fff; cursor:pointer; opacity:.9;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));
    transition:opacity .2s, transform .2s;
  }
  .play-btn:hover{ opacity:1; transform:translate(-50%,-50%) scale(1.1); }
  .play-btn.hidden{ display:none; }
</style>
</head>
<body>

<div id="canvas">

  <!-- ===================== BACKGROUNDS ===================== -->
  <div class="item bg-item" id="bg-hero" style="top: -1.9375px; left: 0.691405px; width: 480px; z-index: 1; ">

  </div>
  <div class="item bg-item" id="bg-paper2" style="top: 3544.39px; left: -171.562px; width: 64.8405px; z-index: 1; ">

  <!-- ===================== HERO ===================== -->
  <div class="item" id="stars-deco" style="top: 0px; left: -40px; width: 69.0381px; z-index: 2; opacity: 0.5; ">
    <img loading="eager" fetchpriority="high" decoding="async" src="images/stars.png" alt="">

  <div class="item zoom-forward" id="balloons" style="top: -17.3242px; left: 72.1211px; width: 340px; z-index: 5; ">

  <div class="item pop" id="camera-wrap" style="top: 997.065px; left: 60.504px; width: 380px; z-index: 4; ">
    <img loading="lazy" decoding="async" src="images/camera.png" alt="Детское фото">
  </div>

  <!-- ===================== POLAROID GALLERY ===================== -->

    <div class="bubble-text"><div><br></div>Слушай сюда, приятель!<br>Сегодня твой день рождения, и я скажу как есть: ты из тех немногих, кто заслуживает настоящего праздника. Так что расслабься, выпей за своё здоровье и знай — я слежу за тобой.<br>С днём рождения!</div>

  </div>
  <div class="item fade-up" id="kodak" style="top: 4428.02px; left: 105.512px; width: 278.666px; z-index: 6; position: absolute;">
    <img loading="lazy" decoding="async" src="images/kodak.png" alt="">
  </div>

  <!-- ===================== TV + WISHES ===================== -->
  <div class="item pop" id="tv" style="top: 4589.85px; left: 26.8945px; width: 443.535px; z-index: 5; ">
    <video id="bdayVideo" src="videos/greeting.mp4" playsinline preload="none" style="position:absolute; top:32.69%; left:16.49%; width:51.85%; height:43.11%; object-fit:cover; background:#000;"></video>
    <img loading="lazy" decoding="async" src="images/TV.png" alt="Видео-поздравление" style="position:relative; z-index:2;">
    <div class="play-btn" id="playBtn"></div>
  </div>
  <div class="item fade-up" id="presents" style="top: 4837.62px; left: 1.69935px; width: 516.586px; z-index: 5; ">
    <img loading="lazy" decoding="async" src="images/presents.png" alt="Пожелания">
  </div>

</div>

<script>
/* ---------- reveal on scroll ---------- */
const revealEls = document.querySelectorAll('.fade-up, .pop, .zoom-forward');
const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach(en=>{ if(en.isIntersecting) en.target.classList.add('show'); });
},{threshold:0.25});
revealEls.forEach(el=>revealObserver.observe(el));

window.addEventListener('load', ()=>{
  ['balloons','imeninik'].forEach((id,i)=>{
    setTimeout(()=>{ const el=document.getElementById(id); if(el) el.classList.add('show'); }, 150 + i*180);
  });
});

const bdayVideo = document.getElementById('bdayVideo');
const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', ()=>{
  bdayVideo.controls = true;
  bdayVideo.play();
  playBtn.classList.add('hidden');
});
bdayVideo.addEventListener('pause', ()=>{ playBtn.classList.remove('hidden'); });
bdayVideo.addEventListener('ended', ()=>{
  playBtn.classList.remove('hidden'); bdayVideo.controls = false;
});

/* =========================================================
   КАТУШКА (kodak) закрепляется на экране, пока плёнка (strip)
   проезжает мимо неё вверх — эффект "плёнка тянется через кодак"
========================================================= */
(function(){
  const kodakEl = document.getElementById('kodak');
  const stripEl = document.getElementById('strip');
  const canvasEl = document.getElementById('canvas');
  if(!kodakEl || !stripEl || !canvasEl) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let restTop, restLeft;
  function readRest(){
    restTop = parseFloat(kodakEl.style.top)||0;
    restLeft = parseFloat(kodakEl.style.left)||0;
  }
  readRest();

  let pinTicking = false;
  function updatePin(){
    pinTicking = false;
    const vh = window.innerHeight;
    const kodakH = kodakEl.offsetHeight || 200;
    const pinAt = Math.min(vh - kodakH - 30, vh*0.6);

    const stripTop = stripEl.offsetTop;
    const stripHeight = stripEl.offsetHeight;

    /* прилипание длится от входа плёнки в линию катушки до момента,
       когда катушка сама естественно дошла бы до этой же линии —
       так раскрытие плёнки и открепление катушки всегда совпадают,
       без рывков и "дыр", даже если их положение немного не совпадает */
    const pinStart = stripTop - pinAt;
    const pinEnd = restTop - pinAt;
    const duration = Math.max(1, pinEnd - pinStart);
    const scrollY = window.scrollY || window.pageYOffset;

    const progress = Math.max(0, Math.min(1, (scrollY - pinStart) / duration));
    const clipBottom = Math.round(stripHeight * (1 - progress));
    stripEl.style.clipPath = `inset(0px 0px ${clipBottom}px 0px)`;

    if(scrollY > pinStart && scrollY < pinEnd){
      const canvasLeft = canvasEl.getBoundingClientRect().left;
      kodakEl.style.position = 'fixed';
      kodakEl.style.top = pinAt + 'px';
      kodakEl.style.left = (canvasLeft + restLeft) + 'px';
      kodakEl.style.zIndex = 50;
    } else {
      kodakEl.style.position = 'absolute';
      kodakEl.style.top = restTop + 'px';
      kodakEl.style.left = restLeft + 'px';
      kodakEl.style.zIndex = 6;
    }
  }
  function onPinScroll(){
    if(!pinTicking){ requestAnimationFrame(updatePin); pinTicking = true; }
  }
  window.addEventListener('scroll', onPinScroll, {passive:true});
  window.addEventListener('resize', onPinScroll);
  onPinScroll();
})();
</script>


</body></html>
